name: CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "hot-fix/fireflies-meeting-recap-*"
  pull_request:
    branches:
      - main
      - hot-fix/fireflies-meeting-recap-codeql-baseline
  schedule:
    - cron: "59 8 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
